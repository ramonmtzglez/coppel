spring:
  application:
    name: tvmaze-middleware
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tvmaze_middleware}
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

tvmaze:
  base-url: https://api.tvmaze.com

logging:
  level:
    com.tvmaze.middleware: INFO
